<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>몽보리 클라임</title>
    <meta name="theme-color" content="#2d2b5c" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/logo-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-mark-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="몽보리 클라임" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <button id="sound" class="sound" type="button" aria-label="소리" aria-pressed="true">
        <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.5 6c2 1.6 3 3.6 3 6s-1 4.4-3 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <section id="start-panel" class="panel start" aria-label="캐릭터 선택">
        <div class="start-head">
          <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><use href="#appIcon" width="512" height="512" /></svg>
          <div>
            <p class="eyebrow nw">몽글이와 보리를 기억하며</p>
            <h1 class="nw">몽보리 클라임</h1>
          </div>
        </div>
        <p class="lead nw">함께 오를 친구를 골라 주세요.</p>
        <form id="start-form" class="start-form">
          <div class="card pick-card" id="pick-card" aria-live="polite">
            <span class="portrait" id="pick-portrait"></span>
            <span class="card-body">
              <span class="card-title"><strong class="nw" id="pick-name"></strong><span class="memo nw" id="pick-tagline"></span></span>
              <span class="stats">
                <span class="nw">오르기</span><span class="bar" id="pick-climb"></span>
                <span class="nw">흔들기</span><span class="bar" id="pick-swing"></span>
                <span class="nw">체력</span><span class="bar" id="pick-hp"></span>
              </span>
              <span class="card-note"><span class="skill-tag nw" id="pick-skill"></span><span id="pick-skill-note"></span><span id="pick-trait"></span></span>
            </span>
          </div>
          <p class="hint nw">키보드: ←/→ 흔들기, 스페이스로 필살기</p>
          <div class="perch" role="group" aria-label="친구 고르기">
            <svg class="perch-branch" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true">
              <defs><linearGradient id="branchG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98a5e" /><stop offset=".55" stop-color="#8d6140" /><stop offset="1" stop-color="#6a452c" /></linearGradient></defs>
              <path d="M-10 14 C60 10 120 18 200 14 C280 10 340 17 410 12 L410 26 C340 31 280 24 200 28 C120 32 60 24 -10 28 Z" fill="url(#branchG)" />
              <path d="M20 17 C70 15 110 19 160 17 M230 16 C280 14 320 19 380 15" stroke="#d2a77c" stroke-width="1.4" fill="none" opacity=".6" stroke-linecap="round" />
              <path d="M300 26 C312 32 318 36 330 38" stroke="#7a5236" stroke-width="3" fill="none" stroke-linecap="round" />
              <ellipse cx="334" cy="37" rx="7" ry="3.4" fill="#8fbf6a" transform="rotate(-18 334 37)" />
            </svg>
            <div class="perch-birds" id="perch-birds"></div>
          </div>
          <label class="field">
            <span class="nw">닉네임</span>
            <input name="displayName" type="text" placeholder="몽보리" maxlength="20" autocomplete="nickname" required />
          </label>
          <button id="start-button" class="primary nw" type="submit">보리와 시작</button>
        </form>
      </section>

      <section id="result-panel" class="panel result hidden" aria-label="결과">
        <div class="sheet">
          <h2 class="nw">결과</h2>
          <p class="tagline nw" id="result-summary"></p>
          <div class="result-stats" id="result-stats"></div>
          <div class="leaderboard" id="leaderboard"></div>
          <div class="result-actions">
            <button class="secondary nw" id="retry-same-button" type="button">재도전</button>
            <button class="primary nw" id="retry-button" type="button">친구 고르기</button>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
